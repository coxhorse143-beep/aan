<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer - GadgetStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 2rem;
        }

        .header h1 i {
            color: #f1c40f;
            margin-right: 12px;
        }

        .header .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header .user-info span {
            opacity: 0.9;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 3px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #0f3460;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .product-card video {
            width: 100%;
            max-height: 150px;
            background: #000;
        }

        .product-card .body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-card .body h3 {
            font-size: 1.1rem;
            color: #1a1a2e;
        }

        .product-card .body .price {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f3460;
            margin: 4px 0;
        }

        .product-card .body .desc {
            font-size: 0.85rem;
            color: #555;
            flex: 1;
            margin-bottom: 10px;
        }

        .btn-buy {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-buy:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.3);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item .item-info {
            display: flex;
            flex-direction: column;
        }

        .cart-item .item-info .item-name {
            font-weight: 600;
            color: #1a1a2e;
        }

        .cart-item .item-info .item-price {
            font-size: 0.85rem;
            color: #0f3460;
        }

        .cart-item .item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item .item-actions button {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .cart-item .item-actions button:hover {
            background: #c0392b;
        }

        .cart-total {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0f3460;
            text-align: right;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #ddd;
        }

        .payment-method {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .payment-method label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        .payment-method select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
        }

        .btn-checkout {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 8px;
        }

        .btn-checkout:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(46, 204, 113, 0.3);
        }

        .order-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .order-item .order-header .order-id {
            font-weight: 600;
            color: #1a1a2e;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .status-unpaid {
            background: #f1c40f;
            color: #1a1a2e;
        }
        .status-process {
            background: #3498db;
            color: white;
        }
        .status-shipped {
            background: #9b59b6;
            color: white;
        }
        .status-done {
            background: #2ecc71;
            color: white;
        }

        .order-item .order-detail {
            font-size: 0.85rem;
            color: #555;
            margin-top: 4px;
        }

        .order-item .payment-method-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 2px;
        }

        .empty-msg {
            color: #999;
            text-align: center;
            padding: 30px 0;
            font-style: italic;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a2e;
            color: white;
            padding: 16px 28px;
            border-radius: 16px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.4s ease;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-left: 6px solid #2ecc71;
        }

        .toast.error {
            border-left: 6px solid #e74c3c;
        }

        @media (max-width: 1024px) {
            .grid-2col {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .catalog-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-store-alt"></i> GadgetStore</h1>
            <div class="user-info">
                <span><i class="fas fa-user"></i> <span id="customerName">Customer</span></span>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="grid-2col">
            <!-- KOLOM KIRI -->
            <div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-th-large"></i> Katalog Produk</div>
                    <div class="catalog-grid" id="catalogGrid"></div>
                </div>
            </div>

            <!-- KOLOM KANAN -->
            <div>
                <!-- Keranjang -->
                <div class="card" style="margin-bottom:20px;">
                    <div class="card-title"><i class="fas fa-shopping-cart"></i> Keranjang Belanja</div>
                    <div id="cartItems"></div>

                    <!-- METODE PEMBAYARAN LENGKAP -->
                    <div class="payment-method">
                        <label><i class="fas fa-credit-card"></i> Pilih Metode Pembayaran</label>
                        <select id="paymentMethod">
                            <optgroup label="🏦 Transfer Bank">
                                <option value="Transfer Bank (BCA)">BCA</option>
                                <option value="Transfer Bank (Mandiri)">Mandiri</option>
                                <option value="Transfer Bank (BNI)">BNI</option>
                                <option value="Transfer Bank (BRI)">BRI</option>
                                <option value="Transfer Bank (BTN)">BTN</option>
                                <option value="Transfer Bank (CIMB Niaga)">CIMB Niaga</option>
                                <option value="Transfer Bank (Danamon)">Danamon</option>
                                <option value="Transfer Bank (Permata)">Permata</option>
                                <option value="Transfer Bank (Maybank)">Maybank</option>
                                <option value="Transfer Bank (OCBC NISP)">OCBC NISP</option>
                                <option value="Transfer Bank (HSBC)">HSBC</option>
                            </optgroup>
                            <optgroup label="📱 E-Wallet">
                                <option value="E-Wallet (GoPay)">GoPay</option>
                                <option value="E-Wallet (OVO)">OVO</option>
                                <option value="E-Wallet (DANA)">DANA</option>
                                <option value="E-Wallet (LinkAja)">LinkAja</option>
                                <option value="E-Wallet (ShopeePay)">ShopeePay</option>
                                <option value="E-Wallet (Sakuku)">Sakuku (BCA)</option>
                                <option value="E-Wallet (QRIS)">QRIS (Semua Aplikasi)</option>
                            </optgroup>
                            <optgroup label="💳 Kartu Kredit/Debit">
                                <option value="Kartu Kredit (Visa)">Visa</option>
                                <option value="Kartu Kredit (Mastercard)">Mastercard</option>
                                <option value="Kartu Kredit (JCB)">JCB</option>
                                <option value="Kartu Kredit (American Express)">American Express</option>
                                <option value="Kartu Debit (Semua Bank)">Kartu Debit (Semua Bank)</option>
                            </optgroup>
                            <optgroup label="🏪 Minimart">
                                <option value="Minimart (Indomaret)">Indomaret</option>
                                <option value="Minimart (Alfamart)">Alfamart</option>
                                <option value="Minimart (Lawson)">Lawson</option>
                                <option value="Minimart (Circle K)">Circle K</option>
                            </optgroup>
                            <optgroup label="📦 Lainnya">
                                <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
                                <option value="PayLater (Bayar Nanti)">PayLater (Bayar Nanti)</option>
                                <option value="Cicilan (0% Bunga)">Cicilan 0% Bunga</option>
                                <option value="Kripto (BTC/ETH)">Kripto (BTC/ETH)</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="cart-total" id="cartTotal">Total: Rp 0</div>
                    <button class="btn-checkout" id="checkoutBtn">
                        <i class="fas fa-credit-card"></i> Checkout Sekarang
                    </button>
                </div>

                <!-- Status Pesanan -->
                <div class="card">
                    <div class="card-title"><i class="fas fa-truck"></i> Status Pesanan Saya</div>
                    <div id="orderList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        // DATA
        // ================================================================
        let products = [];
        let cart = [];
        let orders = [];

        function loadData() {
            try {
                const p = localStorage.getItem('gadgetstore_products');
                const c = localStorage.getItem('gadgetstore_cart');
                const o = localStorage.getItem('gadgetstore_orders');
                products = p ? JSON.parse(p) : [];
                cart = c ? JSON.parse(c) : [];
                orders = o ? JSON.parse(o) : [];
            } catch (e) {
                products = [];
                cart = [];
                orders = [];
            }
        }

        function saveData() {
            localStorage.setItem('gadgetstore_products', JSON.stringify(products));
            localStorage.setItem('gadgetstore_cart', JSON.stringify(cart));
            localStorage.setItem('gadgetstore_orders', JSON.stringify(orders));
        }

        // ================================================================
        // UTILITY
        // ================================================================
        function formatRupiah(num) {
            return 'Rp ' + num.toLocaleString('id-ID');
        }

        function generateId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.classList.remove('show'); }, 3000);
        }

        // ================================================================
        // RENDER CATALOG
        // ================================================================
        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');

            if (products.length === 0) {
                grid.innerHTML = '<p class="empty-msg" style="grid-column:1/-1;">Belum ada produk.</p>';
                return;
            }

            grid.innerHTML = products.map(p => `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.name}" 
                             onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'"/>
                        <div class="body">
                            <h3>${p.name}</h3>
                            <div class="price">${formatRupiah(p.price)}</div>
                            <div class="desc">${p.desc}</div>
                            ${p.video ? `<video controls src="${p.video}"></video>` : ''}
                            <button class="btn-buy" data-id="${p.id}">
                                <i class="fas fa-cart-plus"></i> Beli Sekarang
                            </button>
                        </div>
                    </div>
                `).join('');

            grid.querySelectorAll('.btn-buy').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    addToCart(id);
                });
            });
        }

        // ================================================================
        // CART
        // ================================================================
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(c => c.productId === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ productId: productId, qty: 1 });
            }
            saveData();
            renderCart();
            showToast(`${product.name} ditambahkan ke keranjang! 🛒`, 'success');
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length === 0) {
                container.innerHTML = '<p class="empty-msg">Keranjang kosong.</p>';
                totalEl.textContent = 'Total: Rp 0';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach(item => {
                const prod = products.find(p => p.id === item.productId);
                if (!prod) return;
                const subtotal = prod.price * item.qty;
                total += subtotal;
                html += `
                        <div class="cart-item">
                            <div class="item-info">
                                <span class="item-name">${prod.name}</span>
                                <span class="item-price">${formatRupiah(prod.price)} x${item.qty}</span>
                            </div>
                            <div class="item-actions">
                                <span>${formatRupiah(subtotal)}</span>
                                <button data-cart-id="${item.productId}"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                    `;
            });

            container.innerHTML = html;
            totalEl.textContent = 'Total: ' + formatRupiah(total);

            container.querySelectorAll('[data-cart-id]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.cartId);
                    cart = cart.filter(c => c.productId !== id);
                    saveData();
                    renderCart();
                    showToast('Item dihapus dari keranjang.', 'error');
                });
            });
        }

        // ================================================================
        // CHECKOUT DENGAN METODE PEMBAYARAN LENGKAP
        // ================================================================
        function checkout() {
            if (cart.length === 0) {
                showToast('Keranjang kosong!', 'error');
                return;
            }

            const paymentMethod = document.getElementById('paymentMethod').value;

            let total = 0;
            const items = [];
            cart.forEach(item => {
                const prod = products.find(p => p.id === item.productId);
                if (prod) {
                    total += prod.price * item.qty;
                    items.push({ productName: prod.name, qty: item.qty, price: prod.price });
                }
            });

            const newOrder = {
                id: generateId(),
                items: items,
                total: total,
                status: 'unpaid',
                buyer: 'Customer',
                paymentMethod: paymentMethod,
                date: new Date().toLocaleString()
            };

            orders.push(newOrder);
            cart = [];
            saveData();
            renderAll();
            showToast(
                `✅ Checkout berhasil!\nTotal: ${formatRupiah(total)}\nMetode: ${paymentMethod}`,
                'success'
            );
        }

        // ================================================================
        // RENDER ORDERS
        // ================================================================
        function renderOrders() {
            const container = document.getElementById('orderList');

            if (orders.length === 0) {
                container.innerHTML = '<p class="empty-msg">Belum ada pesanan.</p>';
                return;
            }

            const statusMap = {
                unpaid: { label: 'Belum Dibayar', cls: 'status-unpaid' },
                process: { label: 'Diproses', cls: 'status-process' },
                shipped: { label: 'Dikirim', cls: 'status-shipped' },
                done: { label: 'Selesai', cls: 'status-done' }
            };

            const sorted = [...orders].reverse();
            container.innerHTML = sorted.map(o => {
                const st = statusMap[o.status] || statusMap.unpaid;
                const productNames = o.items ? o.items.map(i => i.productName).join(', ') : 'Produk';
                return `
                        <div class="order-item">
                            <div class="order-header">
                                <span class="order-id">#${o.id}</span>
                                <span class="status-badge ${st.cls}">${st.label}</span>
                            </div>
                            <div class="order-detail">
                                ${productNames} • ${formatRupiah(o.total)}
                            </div>
                            <div class="payment-method-label">
                                <i class="fas fa-credit-card"></i> ${o.paymentMethod || 'Transfer Bank'}
                            </div>
                            <div style="font-size:0.75rem; color:#888; margin-top:2px;">
                                ${o.date || ''}
                            </div>
                        </div>
                    `;
            }).join('');
        }

        // ================================================================
        // RENDER ALL
        // ================================================================
        function renderAll() {
            renderCatalog();
            renderCart();
            renderOrders();
        }

        // ================================================================
        // LOGOUT
        // ================================================================
        function logout() {
            localStorage.removeItem('gadgetstore_user');
            window.location.href = 'login.html';
        }

        // ================================================================
        // CHECK AUTH
        // ================================================================
        function checkAuth() {
            const userData = localStorage.getItem('gadgetstore_user');
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const user = JSON.parse(userData);
                if (user.role !== 'customer') {
                    window.location.href = 'admin.html';
                    return;
                }
                document.getElementById('customerName').textContent = user.username || 'Customer';
            } catch (e) {
                window.location.href = 'login.html';
            }
        }

        // ================================================================
        // INIT
        // ================================================================
        checkAuth();
        loadData();
        renderAll();

        document.getElementById('checkoutBtn').addEventListener('click', checkout);

        window.addEventListener('storage', function(e) {
            if (e.key && e.key.startsWith('gadgetstore_')) {
                loadData();
                renderAll();
            }
        });
    </script>
</body>
</html>
